[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "az"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []          # ctypes is stdlib; torch/numpy etc. join when nn/ is implemented

[project.optional-dependencies]
gui = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[tool.setuptools]
package-dir = {"az" = "."}
packages = ["az", "az.bindings", "az.mcts", "az.nn", "az.selfplay", "az.train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
